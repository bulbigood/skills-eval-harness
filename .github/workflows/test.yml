name: Test evaluation harness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: skills-eval-harness
      - uses: actions/checkout@v6
        with:
          repository: iwe-org/skills
          path: iwe-skills
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: skills-eval-harness/tests/eval/requirements.txt
      - run: pip install -r tests/eval/requirements.txt
        working-directory: skills-eval-harness
      - run: python -m unittest tests.test_eval_scoring tests.test_eval_suite_docs tests.test_iwe_context_routing_eval
        working-directory: skills-eval-harness
